# .github/workflows/daily-fetch.yml

name: Daily MarkSix Full Data Update

permissions:
  contents: write

on:
  schedule:
    - cron: "35 * * * *" # HKT: every hour at :35
      timezone: "Asia/Hong_Kong"
    - cron: "45 21 * * *" # HKT 21:45, retry after the result is usually available
      timezone: "Asia/Hong_Kong"
    - cron: "50 21 * * *" # HKT 21:50, retry if prize data is still propagating
      timezone: "Asia/Hong_Kong"
  workflow_dispatch:
    inputs:
      backfill_history:
        description: "Fetch the complete Mark Six archive from 1993"
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-mark6-update-main
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full crawler
        env:
          BACKFILL_HISTORY: ${{ github.event.inputs.backfill_history || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p docs

          if [[ "$BACKFILL_HISTORY" == "true" ]]; then
            python marksix_full_crawler.py --backfill-history
            exit 0
          fi

          python marksix_full_crawler.py

      - name: Ensure docs folder & disable Jekyll
        run: |
          mkdir -p docs
          touch docs/.nojekyll

      - name: Commit and push only when changed
        env:
          BACKFILL_HISTORY: ${{ github.event.inputs.backfill_history || 'false' }}
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          for attempt in 1 2 3; do
            if [[ "$attempt" -gt 1 ]]; then
              echo "Remote main changed; refreshing data before retry $attempt."
              git fetch origin main
              git reset --mixed origin/main
              git restore --source=origin/main -- \
                docs/marksix_all.json \
                docs/archive/marksix_history.json \
                docs/.nojekyll
              if [[ "$BACKFILL_HISTORY" == "true" ]]; then
                python marksix_full_crawler.py --backfill-history
              else
                python marksix_full_crawler.py
              fi
            fi

            git add docs/marksix_all.json docs/archive/marksix_history.json docs/.nojekyll

            if git diff --staged --quiet; then
              echo "No data changes. Skip commit and push."
              exit 0
            fi

            git commit -m "ci: update marksix_all.json"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed because main changed; retrying."
          done

          echo "Unable to publish data after 3 attempts." >&2
          exit 1
