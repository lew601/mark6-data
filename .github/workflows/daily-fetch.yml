# .github/workflows/daily-fetch.yml

name: Daily MarkSix Full Data Update

permissions:
  contents: write

on:
  schedule:
    - cron: "35 0,6,9,12,15,18,21,22 * * *" # HKT => 00:35,06:35,09:35,12:35,15:35,18:35,21:35,22:35
      timezone: "Asia/Hong_Kong"
    - cron: "45 21 * * *" # HKT 21:45, retry after the result is usually available
      timezone: "Asia/Hong_Kong"
    - cron: "50 21 * * *" # HKT 21:50, retry if prize data is still propagating
      timezone: "Asia/Hong_Kong"
  workflow_dispatch:
    inputs:
      backfill_history:
        description: "Fetch the complete Mark Six archive from 1993"
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-mark6-update-main
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full crawler
        env:
          BACKFILL_HISTORY: ${{ github.event.inputs.backfill_history || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p docs

          if [[ "$BACKFILL_HISTORY" == "true" ]]; then
            python marksix_full_crawler.py --backfill-history
            exit 0
          fi

          python marksix_full_crawler.py

      - name: Ensure docs folder & disable Jekyll
        run: |
          mkdir -p docs
          touch docs/.nojekyll

      - name: Commit and push only when changed
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add docs/marksix_all.json docs/archive/marksix_history.json docs/.nojekyll

          if git diff --staged --quiet; then
            echo "No data changes. Skip commit and push."
            exit 0
          fi

          git commit -m "ci: update marksix_all.json"

          # Rebase with remote tip to avoid non-fast-forward failures.
          git pull --rebase origin main
          git push origin HEAD:main
